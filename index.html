<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GONGCHA RANKINGS</title>
<style>
:root{color-scheme:dark;--bg:#07060d;--card:#110f1f;--card2:#171430;--text:#eeeaff;--muted:#8a85ad;--accent:#ff2e63;--accent2:#8b5cf6;--line:#242042;--gold:#f5b700;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -120px,#2a1458 0%,var(--bg) 70%) no-repeat,var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 96px}
[hidden]{display:none!important}
h1{font-size:clamp(2rem,8vw,3rem);margin:0;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:8px 0 20px}
form{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:20px}
input,textarea{font:inherit;color:var(--text);background:#0b0918;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:1px}
#name{flex:1 1 160px;width:auto}#score{width:90px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;color:var(--text)}
.add{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .15s}
li.row:hover{transform:translateY(-2px);border-color:var(--accent2)}
li.row:nth-child(1){border-color:var(--gold);box-shadow:0 0 24px rgba(245,183,0,.18)}
.rank{font-size:1.3rem;font-weight:800;width:38px;text-align:center;flex:none}
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;border:2px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.nm{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.bar{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.pts{font-weight:800;font-variant-numeric:tabular-nums}
.pc{text-align:right;min-width:56px;flex:none}
.ctl{display:flex;gap:4px;flex:none}
.ctl button{background:var(--card2);border:1px solid var(--line);padding:6px 9px;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:24px}
.back{background:var(--card2);border:1px solid var(--line);margin-bottom:16px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 16px;margin-bottom:14px}
.photo{position:relative;cursor:pointer;display:block}
.photo span{position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:var(--accent2);color:#fff;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.nameIn{text-align:center;font-size:1.5rem;font-weight:800;background:transparent;border-color:transparent}
.role{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.roleIn{text-align:center;font-size:.95rem;background:transparent;border-color:transparent;padding:2px 12px}
.ro .roleIn:placeholder-shown{display:none}
.badge{font-weight:800;color:var(--gold)}
.big{font-size:2.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sec h2{margin:0 0 10px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
textarea{min-height:90px;resize:vertical}
.dl{font-size:.75rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:#34d399}.dn{color:#fb7185}
.pb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pb button{background:var(--card2);border:1px solid var(--line);padding:6px 12px}
.pb .u{border-color:#34d399;color:#34d399}.pb .d{border-color:#fb7185;color:#fb7185}
.cu{display:flex;gap:8px;width:100%;max-width:340px}
.lg{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lg small{color:var(--muted)}
#pub{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:#1b1536;border-top:1px solid var(--accent2);z-index:5}
.ro #f,.ro .ctl,.ro .pb,.ro .cu,.ro .hlf,.ro .hl button,.ro .photo span,.ro .photo input,.ro .tagin{display:none}
.ro .photo{cursor:default}
input:disabled,textarea:disabled{color:var(--text);opacity:1;-webkit-text-fill-color:var(--text)}
.hl{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hl button{background:transparent;color:var(--muted);padding:2px 8px}
.hlf{display:flex;gap:8px;margin-top:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags b{background:var(--card2);border:1px solid var(--accent2);border-radius:99px;padding:2px 10px;font-size:.8rem}
</style>
</head>
<body class="ro">
<main>
<div id="home">
<h1>GONGCHA RANKINGS</h1>
<p class="sub">No appeals. The numbers don’t lie. Tap anyone to open their portfolio.</p>
<form id="f">
<input id="name" placeholder="Friend’s name" maxlength="30" required="">
<input id="score" type="number" value="100" aria-label="Starting points">
<button class="add" type="submit">Add</button>
</form>
<ol id="list"></ol>
</div>
<div id="prof" hidden=""></div>
</main>

<script>
var SRC="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
var KEY="friend-rankings-v1",openId=null,canEdit=false,dirty=false,seed={rev:0,friends:[]};

function uid(){return Math.random().toString(36).slice(2,10)}
function norm(){friends.forEach(function(f){f.id=f.id||uid();f.img=f.img||"";f.bio=f.bio||"";f.tags=f.tags||"";f.role=f.role||"";f.hl=f.hl||[];f.log=f.log||[]})}

var html=SRC.replace(/(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/,function(m,x,y){return x+json+y});
await a.publish(html)}catch(e){b.disabled=false;b.textContent="Couldn’t publish, try again"}}
document.getElementById("pubBtn").onclick=function(){publish()};
function enableEdit(){canEdit=true;document.body.classList.remove("ro");
try{var l=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(l))l={rev:0,friends:l};if(l&&l.rev===seed.rev&&Array.isArray(l.friends)&&l.friends.length){friends=l.friends;norm();dirty=true}}catch(e){}

function ago(t){var s=Math.floor((Date.now()-t)/1000);if(s<60)return "just now";var m=Math.floor(s/60);if(m<60)return m+"m ago";var h=Math.floor(m/60);if(h<24)return h+"h ago";return Math.floor(h/24)+"d ago"}
function dl(f){var l=f.log[f.log.length-1];if(!l)return null;return el("div","dl "+(l.d>0?"up":"dn"),(l.d>0?"▲ +":"▼ −")+Math.abs(l.d))}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function find(id){return friends.filter(function(f){return f.id===id})[0]}
function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
function rankOf(f){return friends.slice().sort(function(a,b){return b.p-a.p}).indexOf(f)+1}
function avatar(f,sz){var a=el("div","av");a.style.width=a.style.height=sz+"px";a.style.fontSize=(sz*.42)+"px";

else{a.textContent=(f.n[0]||"?").toUpperCase();var h=hue(f.n);a.style.background="linear-gradient(135deg,hsl("+h+",70%,45%),hsl("+(h+50)+",70%,28%))"}return a}
var home=document.getElementById("home"),prof=document.getElementById("prof");
function render(){
home.hidden=false;prof.hidden=true;
var ol=document.getElementById("list");ol.innerHTML="";

friends.sort(function(a,b){return b.p-a.p});
var medals=["🥇","🥈","🥉"],mx=Math.max(1,friends[0].p);
friends.forEach(function(f,i){
