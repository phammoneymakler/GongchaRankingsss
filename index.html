<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GONGCHA RANKINGS</title>
<style>
:root{color-scheme:dark;--bg:#07060d;--card:#110f1f;--card2:#171430;--text:#eeeaff;--muted:#8a85ad;--accent:#ff2e63;--accent2:#8b5cf6;--line:#242042;--gold:#f5b700;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -120px,#2a1458 0%,var(--bg) 70%) no-repeat,var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 96px}
[hidden]{display:none!important}
h1{font-size:clamp(2rem,8vw,3rem);margin:0;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:8px 0 20px}
form{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:20px}
input,textarea{font:inherit;color:var(--text);background:#0b0918;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:1px}
#name{flex:1 1 160px;width:auto}#score{width:90px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;color:var(--text)}
.add{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .15s}
li.row:hover{transform:translateY(-2px);border-color:var(--accent2)}
li.row.first{border-color:var(--gold);box-shadow:0 0 24px rgba(245,183,0,.18)}
.rank{font-size:1.3rem;font-weight:800;width:38px;text-align:center;flex:none}
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;border:2px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.nm{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.bar{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.pts{font-weight:800;font-variant-numeric:tabular-nums}
.pc{text-align:right;min-width:56px;flex:none}
.ctl{display:flex;gap:4px;flex:none}
.ctl button{background:var(--card2);border:1px solid var(--line);padding:6px 9px;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:24px}
.back{background:var(--card2);border:1px solid var(--line);margin-bottom:16px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 16px;margin-bottom:14px}
.photo{position:relative;cursor:pointer;display:block}
.photo span{position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:var(--accent2);color:#fff;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.nameIn{text-align:center;font-size:1.5rem;font-weight:800;background:transparent;border-color:transparent}
.role{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.roleIn{text-align:center;font-size:.95rem;background:transparent;border-color:transparent;padding:2px 12px}
.ro .roleIn:placeholder-shown{display:none}
.badge{font-weight:800;color:var(--gold)}
.big{font-size:2.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sec h2{margin:0 0 10px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
textarea{min-height:90px;resize:vertical}
.dl{font-size:.75rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:#34d399}.dn{color:#fb7185}
.pb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pb button{background:var(--card2);border:1px solid var(--line);padding:6px 12px}
.pb .u{border-color:#34d399;color:#34d399}.pb .d{border-color:#fb7185;color:#fb7185}
.cu{display:flex;gap:8px;width:100%;max-width:340px}
.lg{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lg small{color:var(--muted)}
#pub{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:#1b1536;border-top:1px solid var(--accent2);z-index:5}
.ro #f,.ro .ctl,.ro .pb,.ro .cu,.ro .hlf,.ro .hl button,.ro .photo span,.ro .photo input,.ro .tagin{display:none}
.ro .photo{cursor:default}
#news{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#3a0a1a,#1b1536);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:10px}
#news b{background:var(--accent);color:#fff;font-size:.7rem;letter-spacing:.1em;padding:3px 8px;border-radius:6px;flex:none;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#news b{animation:none}}
#newsTx{font-weight:700;font-size:clamp(1.2rem,5vw,1.7rem);line-height:1.25;overflow-wrap:anywhere}
.newsIn{margin-bottom:10px}
.ro .newsIn{display:none}
.upd{color:var(--muted);font-size:.8rem;margin:0 0 14px}
.rv{opacity:0}
.rv.in{opacity:1;animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(32px) scale(.96)}to{opacity:1;transform:none}}
#prog{position:fixed;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:0 50%;transform:scaleX(0);z-index:6;pointer-events:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1}.rv.in{animation:none}#prog{display:none}}
#ban{width:100%;max-width:none;margin-top:4px;margin-left:auto;margin-right:auto;position:relative;border-radius:18px;overflow:hidden;margin-bottom:16px;background:linear-gradient(135deg,#3a0a1a,#2a1458);border:1px solid var(--line)}
#ban img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
#banTitle{padding:12px 16px;font-size:clamp(1.1rem,4.5vw,1.5rem);font-weight:800;overflow-wrap:anywhere;text-align:center;background:var(--card)}
#banTitle:empty{display:none}
#ban.noimg #banTitle{background:none;padding:28px 16px;width:100%}
#ban.noimg{aspect-ratio:4/3;display:flex;align-items:center}
.banCtl{margin-top:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.banUp{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.banUp input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;padding:0;border:0}
#banIn{flex:1 1 160px;width:auto}
.ro .banCtl{display:none}
input:disabled,textarea:disabled{color:var(--text);opacity:1;-webkit-text-fill-color:var(--text)}
.hl{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hl button{background:transparent;color:var(--muted);padding:2px 8px}
.hlf{display:flex;gap:8px;margin-top:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags b{background:var(--card2);border:1px solid var(--accent2);border-radius:99px;padding:2px 10px;font-size:.8rem}
</style>
</head>
<body class="ro">
<main>
<div id="home">
<h1>GONGCHA RANKINGS</h1>
<p class="sub">No appeals. The numbers don’t lie. Tap anyone to open their portfolio.</p>
<div id="ban" hidden=""><img id="banImg" alt="" hidden=""><div id="banTitle"></div></div>
<div class="banCtl"><label class="banUp">Upload image<input id="banFile" type="file" accept="image/*"></label><input id="banIn" maxlength="60" placeholder="Image title" aria-label="Image title"></div>
<div id="news" hidden=""><b>BREAKING</b><span id="newsTx"></span></div>
<input id="newsIn" class="newsIn" maxlength="140" placeholder="Write breaking news (leave empty to hide)" aria-label="Breaking news">
<div id="upd" class="upd"></div>
<form id="f">
<input id="name" placeholder="Friend’s name" maxlength="30" required="">
<input id="score" type="number" value="100" aria-label="Starting points">
<button class="add" type="submit">Add</button>
</form>
<ol id="list"></ol>
</div>
<div id="prof" hidden=""></div>
</main>

<script>
var SRC="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
var KEY="friend-rankings-v1",openId=null,canEdit=false,dirty=false,news="",updated=0,ban={img:"",title:""},seed={rev:0,friends:[]};
try{var sd=JSON.parse(document.getElementById("seed").textContent);if(sd&&Array.isArray(sd.friends))seed=sd}catch(e){}
var friends=JSON.parse(JSON.stringify(seed.friends));news=seed.news||"";updated=seed.updated||0;if(seed.banner)ban={img:seed.banner.img||"",title:seed.banner.title||""};
function uid(){return Math.random().toString(36).slice(2,10)}
function norm(){friends.forEach(function(f){f.id=f.id||uid();f.img=f.img||"";f.bio=f.bio||"";f.tags=f.tags||"";f.role=f.role||"";f.hl=f.hl||[];f.log=f.log||[]})}
norm();
function bar(){document.getElementById("pub").hidden=!(canEdit&&dirty)}
function drawBan(){var b=document.getElementById("ban"),im=document.getElementById("banImg");
b.hidden=!(ban.img||ban.title);b.classList.toggle("noimg",!ban.img);im.hidden=!ban.img;if(ban.img)im.src=ban.img;
document.getElementById("banTitle").textContent=ban.title;
var bi=document.getElementById("banIn");if(document.activeElement!==bi)bi.value=ban.title}
document.getElementById("banIn").oninput=function(){ban.title=this.value;save();drawBan()};
document.getElementById("banFile").onchange=function(){var inp=this,file=inp.files[0];if(!file)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
var c=document.createElement("canvas");c.width=600;c.height=600;var x=c.getContext("2d"),s=Math.max(600/im.width,600/im.height),w=im.width*s,h=im.height*s;
x.drawImage(im,(600-w)/2,(600-h)/2,w,h);ban.img=c.toDataURL("image/jpeg",.8);save();drawBan();inp.value=""};im.src=r.result};r.readAsDataURL(file)};
var rowsAnimated=false,io=null;
function reveal(root){var els=(root||document).querySelectorAll(".rv:not(.in)");
if(!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in")});return}
io=io||new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}})},{threshold:.1});
els.forEach(function(e){io.observe(e)})}
function showNews(){document.getElementById("news").hidden=!news;document.getElementById("newsTx").textContent=news}
function drawNews(){drawBan();showNews();var ni=document.getElementById("newsIn");if(document.activeElement!==ni)ni.value=news;
document.getElementById("upd").textContent=updated?"Last updated: "+new Date(updated).toLocaleString([],{dateStyle:"medium",timeStyle:"short"}):""}
document.getElementById("newsIn").oninput=function(){news=this.value;save();showNews()};
function save(){dirty=true;try{localStorage.setItem(KEY,JSON.stringify({rev:seed.rev,friends:friends,news:news,banner:ban}))}catch(e){}bar()}
async function publish(){var b=document.getElementById("pubBtn");b.disabled=true;b.textContent="Publishing…";
try{var a=await window.claude.use("artifact");if(!a)throw new Error("unavailable");
var json=JSON.stringify({rev:seed.rev+1,friends:friends,news:news,banner:ban,updated:Date.now()}).replace(/</g,"\\u003c");
var html=SRC.replace(/(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/,function(m,x,y){return x+json+y});
await a.publish(html)}catch(e){b.disabled=false;b.textContent="Couldn’t publish, try again"}}
document.getElementById("pubBtn").onclick=function(){publish()};
function enableEdit(){canEdit=true;document.body.classList.remove("ro");
try{var l=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(l))l={rev:0,friends:l};if(l&&l.rev===seed.rev&&Array.isArray(l.friends)&&l.friends.length){friends=l.friends;if(typeof l.news==="string")news=l.news;if(l.banner)ban=l.banner;norm();dirty=true}}catch(e){}
if(openId&&find(openId))showProf();else render();bar()}
document.querySelectorAll("#home > h1,#home > .sub,#ban,.banCtl,#news,#upd,#f").forEach(function(e,i){e.classList.add("rv");e.style.animationDelay=i*70+"ms"});
var pg=document.createElement("div");pg.id="prog";document.body.appendChild(pg);
window.addEventListener("scroll",function(){var h=document.documentElement.scrollHeight-window.innerHeight;pg.style.transform="scaleX("+(h>0?window.scrollY/h:0)+")"},{passive:true});
reveal(document);
try{if(window.claude&&window.claude.use)window.claude.use("user").then(function(u){if(u&&u.canEdit())enableEdit()}).catch(function(){})}catch(e){}
function bump(f,d){d=Math.round(d);if(!d)return;f.p+=d;f.log.push({d:d,p:f.p,t:Date.now()});if(f.log.length>50)f.log.shift();save()}
function ago(t){var s=Math.floor((Date.now()-t)/1000);if(s<60)return "just now";var m=Math.floor(s/60);if(m<60)return m+"m ago";var h=Math.floor(m/60);if(h<24)return h+"h ago";return Math.floor(h/24)+"d ago"}
function dl(f){var l=f.log[f.log.length-1];if(!l)return null;return el("div","dl "+(l.d>0?"up":"dn"),(l.d>0?"▲ +":"▼ −")+Math.abs(l.d))}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function find(id){return friends.filter(function(f){return f.id===id})[0]}
function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
function rankOf(f){return friends.filter(function(g){return g.p>f.p}).length+1}
function avatar(f,sz){var a=el("div","av");a.style.width=a.style.height=sz+"px";a.style.fontSize=(sz*.42)+"px";
if(f.img){var i=document.createElement("img");i.src=f.img;i.alt="";a.appendChild(i)}
else{a.textContent=(f.n[0]||"?").toUpperCase();var h=hue(f.n);a.style.background="linear-gradient(135deg,hsl("+h+",70%,45%),hsl("+(h+50)+",70%,28%))"}return a}
var home=document.getElementById("home"),prof=document.getElementById("prof");
function render(){
home.hidden=false;prof.hidden=true;drawNews();
var ol=document.getElementById("list");ol.innerHTML="";
if(!friends.length){ol.appendChild(el("li","empty","No friends yet. Tragic."));return}
friends.sort(function(a,b){return b.p-a.p});
var medals=["🥇","🥈","🥉"],mx=Math.max(1,friends[0].p),anim=!rowsAnimated,rk=[];
friends.forEach(function(f,i){rk[i]=i>0&&f.p===friends[i-1].p?rk[i-1]:i+1});
friends.forEach(function(f,i){
var li=el("li","row"+(rk[i]===1?" first":"")+(anim?" rv":""));if(anim)li.style.animationDelay=Math.min(i,5)*50+"ms";li.tabIndex=0;
li.onclick=function(){openProf(f.id)};
li.onkeydown=function(e){if(e.key==="Enter")openProf(f.id)};
li.appendChild(el("div","rank",rk[i]<=3?medals[rk[i]-1]:"#"+rk[i]));
li.appendChild(avatar(f,48));
var info=el("div","info");info.appendChild(el("div","nm",f.n));if(f.role)info.appendChild(el("div","role",f.role));
var bar=el("div","bar"),fill=el("i");fill.style.width=Math.max(0,f.p/mx*100)+"%";bar.appendChild(fill);info.appendChild(bar);li.appendChild(info);
var pc=el("div","pc");pc.appendChild(el("div","pts",String(f.p)));var dd=dl(f);if(dd)pc.appendChild(dd);li.appendChild(pc);
var c=el("div","ctl");
[["+",5],["−",-5]].forEach(function(b){var bt=el("button","",b[0]);bt.setAttribute("aria-label",b[1]>0?"Add 5 points":"Remove 5 points");bt.onclick=function(e){e.stopPropagation();bump(f,b[1]);render()};c.appendChild(bt)});
var d=el("button","","✕");d.setAttribute("aria-label","Remove "+f.n);d.onclick=function(e){e.stopPropagation();friends.splice(friends.indexOf(f),1);save();render()};c.appendChild(d);
li.appendChild(c);ol.appendChild(li)});rowsAnimated=true;reveal(ol)}
function openProf(id){openId=id;showProf()}
function photo(file,f){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
var c=document.createElement("canvas");c.width=c.height=220;var x=c.getContext("2d"),s=Math.min(im.width,im.height);
x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,220,220);f.img=c.toDataURL("image/jpeg",.8);save();showProf()};im.src=r.result};r.readAsDataURL(file)}
function showProf(){
var f=find(openId);if(!f){render();return}
home.hidden=true;prof.hidden=false;prof.innerHTML="";window.scrollTo(0,0);
var bk=el("button","back","← All rankings");bk.onclick=function(){openId=null;render()};prof.appendChild(bk);
var hero=el("div","hero");
var ph=el("label","photo");ph.appendChild(avatar(f,128));ph.appendChild(el("span","","Change photo"));
var fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.onchange=function(){if(fi.files[0])photo(fi.files[0],f)};ph.appendChild(fi);hero.appendChild(ph);
var ni=document.createElement("input");ni.className="nameIn";ni.value=f.n;ni.maxLength=30;ni.setAttribute("aria-label","Name");ni.oninput=function(){f.n=ni.value||"Unnamed";save()};hero.appendChild(ni);
var ri=document.createElement("input");ri.className="roleIn";ri.value=f.role;ri.maxLength=40;ri.placeholder="Add a role (e.g. Snack Captain)";ri.setAttribute("aria-label","Role");ri.oninput=function(){f.role=ri.value;save()};hero.appendChild(ri);
var rk=el("div","badge","Rank #"+rankOf(f));hero.appendChild(rk);
var big=el("div","big",String(f.p));hero.appendChild(big);
var lgs=el("div","sec"),lg=el("div");lgs.appendChild(el("h2","","Point history"));lgs.appendChild(lg);
function drawLog(){big.textContent=f.p;rk.textContent="Rank #"+rankOf(f);lg.innerHTML="";
if(!f.log.length){lg.appendChild(el("div","empty","No point changes yet."));return}
f.log.slice(-10).reverse().forEach(function(l){var r=el("div","lg");r.appendChild(el("span","dl "+(l.d>0?"up":"dn"),(l.d>0?"▲ +":"▼ −")+Math.abs(l.d)));r.appendChild(el("span","","→ "+l.p+" pts"));r.appendChild(el("small","",ago(l.t)));lg.appendChild(r)})}
var pb=el("div","pb");
[-10,-5,-1,1,5,10].forEach(function(d){var b=el("button",d>0?"u":"d",(d>0?"+":"−")+Math.abs(d));b.onclick=function(){bump(f,d);drawLog()};pb.appendChild(b)});hero.appendChild(pb);
var cu=el("div","cu"),ci=document.createElement("input");ci.type="number";ci.placeholder="Custom (e.g. 250 or -40)";ci.setAttribute("aria-label","Custom points");
var cb=el("button","add","Apply");cb.onclick=function(){var v=parseInt(ci.value,10);if(!v)return;bump(f,v);ci.value="";drawLog()};
cu.appendChild(ci);cu.appendChild(cb);hero.appendChild(cu);
prof.appendChild(hero);prof.appendChild(lgs);drawLog();
var a=el("div","sec");a.appendChild(el("h2","","About"));
var ta=document.createElement("textarea");ta.placeholder="Who is this person? Why do they rank where they do?";ta.value=f.bio;ta.oninput=function(){f.bio=ta.value;save()};a.appendChild(ta);
var ti=document.createElement("input");ti.placeholder="Tags, comma separated (funny, driver, snack-thief)";ti.value=f.tags;ti.style.marginTop="8px";ti.className="tagin";
var tg=el("div","tags");function drawTags(){tg.innerHTML="";f.tags.split(",").map(function(t){return t.trim()}).filter(Boolean).forEach(function(t){tg.appendChild(el("b","",t))})}
ti.oninput=function(){f.tags=ti.value;save();drawTags()};drawTags();a.appendChild(ti);a.appendChild(tg);prof.appendChild(a);
var h=el("div","sec");h.appendChild(el("h2","","Highlights"));var hl=el("div");h.appendChild(hl);
function drawHl(){hl.innerHTML="";if(!f.hl.length)hl.appendChild(el("div","empty","No highlights yet."));
f.hl.forEach(function(t,i){var r=el("div","hl");r.appendChild(el("span","",t));var x=el("button","","✕");x.setAttribute("aria-label","Remove highlight");x.onclick=function(){f.hl.splice(i,1);save();drawHl()};r.appendChild(x);hl.appendChild(r)})}
drawHl();
var hf=el("div","hlf"),hi=document.createElement("input");hi.placeholder="Add a legendary moment…";hi.maxLength=120;
var hb=el("button","add","Add");function addH(){var t=hi.value.trim();if(!t)return;f.hl.push(t);hi.value="";save();drawHl()}
hb.onclick=addH;hi.onkeydown=function(e){if(e.key==="Enter")addH()};hf.appendChild(hi);hf.appendChild(hb);h.appendChild(hf);prof.appendChild(h);if(!canEdit)prof.querySelectorAll("input,textarea").forEach(function(x){x.disabled=true});prof.querySelectorAll(".hero,.sec").forEach(function(e,i){e.classList.add("rv");e.style.animationDelay=i*70+"ms"});reveal(prof)}
document.getElementById("f").onsubmit=function(e){e.preventDefault();
var n=document.getElementById("name"),p=document.getElementById("score"),v=n.value.trim();if(!v)return;
friends.push({id:uid(),n:v,p:parseInt(p.value,10)||0,img:"",bio:"",tags:"",hl:[],log:[]});n.value="";save();render();n.focus()};
render();
</script></body></html>
